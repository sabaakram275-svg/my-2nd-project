<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn clear" data-action="clear">AC</button>
            <button class="btn operator" data-action="divide">÷</button>
            <button class="btn operator" data-action="multiply">×</button>
            <button class="btn digit">7</button>
            <button class="btn digit">8</button>
            <button class="btn digit">9</button>
            <button class="btn operator" data-action="subtract">-</button>
            <button class="btn digit">4</button>
            <button class="btn digit">5</button>
            <button class="btn digit">6</button>
            <button class="btn operator" data-action="add">+</button>
            <button class="btn digit">1</button>
            <button class="btn digit">2</button>
            <button class="btn digit">3</button>
            <button class="btn equals" data-action="equals">=</button>
            <button class="btn digit zero">0</button>
            <button class="btn decimal" data-action="decimal">.</button>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
