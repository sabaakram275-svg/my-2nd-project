<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Memory Game for Kids</title>
    <link rel="stylesheet" href="color-memory.css">
</head>
<body>
    <div class="game-container">
        <h1>🎨 Color Memory Game 🎨</h1>
        <p class="subtitle">Match the colors and win!</p>
        
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Score:</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Moves:</span>
                <span id="moves" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Best:</span>
                <span id="best" class="stat-value">-</span>
            </div>
        </div>

        <div class="difficulty-selector">
            <button class="diff-btn active" data-difficulty="easy">Easy</button>
            <button class="diff-btn" data-difficulty="medium">Medium</button>
            <button class="diff-btn" data-difficulty="hard">Hard</button>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="button-group">
            <button id="resetButton" class="btn reset-btn">🔄 New Game</button>
            <button id="homeButton" class="btn home-btn">🏠 Home</button>
        </div>

        <div class="celebration" id="celebration">
            <p>🎉 You Won! 🎉</p>
        </div>
    </div>

    <script src="color-memory.js"></script>
</body>
</html>
